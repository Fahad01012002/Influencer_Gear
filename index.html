<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Gear</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
</head>

<body class="font-family">
    <!-- header section -->
    <header class="max-width">
        <nav class="navbar display-flex">
            <h2 class="navbar-heading">Influencer products</h2>
            <ul class="nav-links display-flex">
                <li class="nav-list"><a href="#" class="nav-link">Home</a></li>
                <li class="nav-list"><a href="#" class="nav-link">Products</a></li>
                <li class="nav-list"><a href="#" class="nav-link">Sign Up</a></li>
                <li class="nav-list"><a href="#" class="nav-link">Log In</a></li>
                <li class="nav-list"><a href="#" class="nav-link"><i class="fa-solid fa-magnifying-glass"></i></a></li>
                <li class="nav-list"><a href="#" class="nav-link"><i class="fa-solid fa-cart-shopping"></i></a></li>
            </ul>
        </nav>

        <section class="banner display-flex">
            <div class="banner-content">
                <h2 class="banner-heading">Start your Journey as
                    Influencer</h2>
                <p class="banner-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sem vestibulum
                    sed scelerisque eros. Lectus faucibus.</p>
                <button class="primary-btn">
                    Preebook Now <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </div>

            <div class="banner-image">
                <img src="images/main-camera.png" alt="Camera">
            </div>
        </section>

        <section class="sponsor display-flex">
            <img src="logos/Alibaba.svg" alt="">
            <img src="logos/Amazon.svg" alt="">
            <img src="logos/Daraz.pk Logo.svg" alt="">
            <img src="logos/Ebay.svg" alt="">
            <img src="logos/Rakuten.svg" alt="">
            <img src="logos/Target.svg" alt="">
            <img src="logos/Walmart.svg" alt="">
        </section>
    </header>
</body>

</html>
